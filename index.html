<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      color: #1f2937;
    }

    main {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 2rem;
    }

    p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome</h1>
    <p>GitHub Pages で公開するためのシンプルなWebサイトです。</p>
  </main>
</body>
</html>
